name: Publish changes to Postman
on:
  push:
    branches:
      - main  # Trigger sync when code is merged to main

jobs:
  publish-changes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install Postman CLI
        uses: postmanlabs/postman-cli-action@v1
        with:
          command: "--version"
          api-key: ${{ secrets.POSTMAN_API_KEY }}

      - name: Login to Postman
        run: postman login --with-api-key ${{ secrets.POSTMAN_API_KEY }}
      - name: Publish changes to Cloud
        run: postman workspace push -y

