name: Run Postman Collection Tests

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:
    inputs:
      environment_path:
        description: "Optional local environment file path override"
        required: false
        type: string

permissions:
  contents: read

jobs:
  run-postman-collection-tests:
    name: Run Postman Collection Tests
    runs-on: ubuntu-latest
    env:
      POSTMAN_COLLECTIONS_ROOT: postman/collections
      POSTMAN_TEST_ENVIRONMENT_PATH: ${{ inputs.environment_path || vars.POSTMAN_TEST_ENVIRONMENT_PATH }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Postman CLI
        run: npm install -g postman-cli

      - name: Authenticate Postman CLI
        run: postman login --with-api-key "$POSTMAN_API_KEY"
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}

      - name: Run tests for all local repo collections
        run: |
          set +e
          set -o pipefail

          collections_root="${POSTMAN_COLLECTIONS_ROOT}"
          if [ ! -d "$collections_root" ]; then
            echo "Collections root not found: $collections_root"
            echo "## Postman Collection Test Results" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Collections root not found: \`$collections_root\`." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          environment_path="${POSTMAN_TEST_ENVIRONMENT_PATH}"
          if [ -z "$environment_path" ]; then
            environment_path="$(ruby -ryaml -e '
              data = YAML.load_file(".postman/resources.yaml") || {}
              environments = data.fetch("cloudResources", {}).fetch("environments", {})
              path = environments.keys.first
              puts path if path
            ')"
          fi

          if [ -n "$environment_path" ] && [ ! -f "$environment_path" ]; then
            echo "Configured environment file not found: $environment_path"
            echo "## Postman Collection Test Results" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Configured environment file not found: \`$environment_path\`." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          ruby -e '
            root = ARGV[0]
            entries = Dir.children(root).sort
            entries.each do |entry|
              collection_dir = File.join(root, entry)
              next unless File.directory?(collection_dir)
              definition = File.join(collection_dir, ".resources", "definition.yaml")
              next unless File.file?(definition)
              puts collection_dir
            end
          ' "$collections_root" > collection-list.txt

          if [ ! -s collection-list.txt ]; then
            echo "No local collections found in ${collections_root}."
            echo "## Postman Collection Test Results" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "No local collections found in \`${collections_root}\`." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "## Postman Collection Test Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$environment_path" ]; then
            echo "Using local environment file: \`$environment_path\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No local environment file configured; running collections without an environment." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"

          overall_exit=0
          while IFS= read -r collection_path; do
            echo "Running local collection: ${collection_path}"
            echo "### ${collection_path}" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"

            if [ -n "$environment_path" ]; then
              postman collection run "$collection_path" --environment "$environment_path" 2>&1 | tee postman-collection-test.log
            else
              postman collection run "$collection_path" 2>&1 | tee postman-collection-test.log
            fi
            run_exit=${PIPESTATUS[0]}

            cat postman-collection-test.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"

            if [ "$run_exit" -ne 0 ]; then
              overall_exit=1
            fi
          done < collection-list.txt

          exit "$overall_exit"
