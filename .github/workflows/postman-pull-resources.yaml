name: Pull Postman workspace resources
on:
  workflow_run:
    workflows:
      - Sync Postman collections
    types:
      - completed
    branches:
      - main

permissions:
  contents: write

jobs:
  pull-resources:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install Postman CLI
        uses: postmanlabs/postman-cli-action@v1
        with:
          command: "--version"
          api-key: ${{ secrets.POSTMAN_API_KEY }}

      - name: Login to Postman
        run: postman login --with-api-key ${{ secrets.POSTMAN_API_KEY }}

      - name: Pull cloud-created resources
        run: postman workspace pull -y

      - name: Commit pulled resources
        env:
          GH_BOT_NAME: github-actions[bot]
          GH_BOT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git config user.name "$GH_BOT_NAME"
          git config user.email "$GH_BOT_EMAIL"
          git add -A
          if git diff --cached --quiet; then
            echo "No cloud resource changes to commit."
            exit 0
          fi
          git commit -m "chore(postman): pull cloud-created resources [skip sync]"
          git push origin HEAD:main
