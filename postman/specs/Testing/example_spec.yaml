openapi: 3.0.0
info:
  title: Example Collection
  version: 1.0.0
  description: A small HTTP API that returns randomly generated JSON payloads.
servers:
  - url: '{{baseUrl}}'
paths:
  /:
    get:
      summary: Get service information
      operationId: getServiceInfo
      responses:
        '200':
          description: Service information and available endpoints.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Simple random JSON server
                  endpoints:
                    type: array
                    example:
                      - /api/profile
                      - /api/weather
                      - /api/metrics
                    items:
                      type: string
                required:
                  - message
                  - endpoints
              example:
                message: Simple random JSON server
                endpoints:
                  - /api/profile
                  - /api/weather
                  - /api/metrics
        '404':
          description: The requested route was not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
              example:
                error: string
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: Internal Server Error
  /api/profile:
    patch:
      summary: Update a random user profile
      operationId: patchRandomProfile
      responses:
        '200':
          description: A randomly generated user profile.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    minLength: 8
                    maxLength: 8
                    example: ab12cd34
                  name:
                    type: string
                    pattern: ^User-[0-9]{3}$
                    example: User-123
                  score:
                    type: integer
                    minimum: 1
                    maximum: 100
                    example: 87
                  active:
                    type: boolean
                    example: true
                required:
                  - id
                  - name
                  - score
                  - active
              example:
                id: ab12cd34
                name: User-123
                score: 87
                active: true
        '404':
          description: The requested route was not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
              example:
                error: string
    get:
      summary: Get a random user profile
      operationId: getRandomProfile
      responses:
        '200':
          description: A randomly generated user profile.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    minLength: 8
                    maxLength: 8
                    example: ab12cd34
                  name:
                    type: string
                    pattern: ^User-[0-9]{3}$
                    example: User-123
                  score:
                    type: integer
                    minimum: 1
                    maximum: 100
                    example: 87
                  active:
                    type: boolean
                    example: true
                required:
                  - id
                  - name
                  - score
                  - active
              example:
                id: ab12cd34
                name: User-123
                score: 87
                active: true
        '404':
          description: The requested route was not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
              example:
                error: string
  /api/weather:
    get:
      summary: Get random weather data
      operationId: getRandomWeather
      responses:
        '200':
          description: Randomly generated weather data.
          content:
            application/json:
              schema:
                type: object
                properties:
                  location:
                    type: string
                    pattern: ^City-[0-9]+$
                    example: City-12
                  temperatureF:
                    type: integer
                    minimum: 40
                    maximum: 100
                    example: 72
                  humidity:
                    type: number
                    minimum: 0.2
                    maximum: 0.9
                    example: 0.63
                  condition:
                    type: string
                    enum:
                      - sunny
                      - cloudy
                      - rainy
                      - windy
                required:
                  - location
                  - temperatureF
                  - humidity
                  - condition
              example:
                location: City-12
                temperatureF: 72
                humidity: 0.63
                condition: rainy
        '404':
          description: The requested route was not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
              example:
                error: string
  /api/metrics:
    get:
      summary: Get random system metrics
      operationId: getRandomMetrics
      responses:
        '200':
          description: Randomly generated system metrics.
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId:
                    type: string
                    minLength: 8
                    maxLength: 8
                    example: ef56gh78
                  cpuLoad:
                    type: number
                    minimum: 0
                    maximum: 1
                    example: 0.421
                  memoryMb:
                    type: integer
                    minimum: 128
                    maximum: 4096
                    example: 1024
                  latencyMs:
                    type: integer
                    minimum: 10
                    maximum: 500
                    example: 125
                required:
                  - requestId
                  - cpuLoad
                  - memoryMb
                  - latencyMs
              example:
                requestId: ef56gh78
                cpuLoad: 0.421
                memoryMb: 1024
                latencyMs: 125
        '404':
          description: The requested route was not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
              example:
                error: string
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
              example:
                error: string
  /api/orders:
    get:
      summary: Get random order data
      operationId: getRandomOrder
      responses:
        '200':
          description: Randomly generated order data.
          content:
            application/json:
              schema:
                type: object
                properties:
                  orderId:
                    type: string
                    pattern: ^ORD-[0-9]{6}$
                    example: ORD-123456
                  itemCount:
                    type: integer
                    minimum: 1
                    maximum: 8
                    example: 3
                  totalUsd:
                    type: number
                    minimum: 9.99
                    maximum: 499.99
                    example: 149.95
                  status:
                    type: string
                    enum:
                      - processing
                      - shipped
                      - delivered
                      - cancelled
                required:
                  - orderId
                  - itemCount
                  - totalUsd
                  - status
        '404':
          description: The requested route was not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
  /api/inventory:
    get:
      summary: Get random inventory data
      operationId: getRandomInventory
      responses:
        '200':
          description: Randomly generated inventory data.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sku:
                    type: string
                    pattern: ^SKU-[0-9]{4}$
                    example: SKU-4821
                  inStock:
                    type: integer
                    minimum: 0
                    maximum: 500
                    example: 238
                  reorderLevel:
                    type: integer
                    minimum: 10
                    maximum: 150
                    example: 75
                  warehouse:
                    type: string
                    pattern: ^WH-[1-5]$
                    example: WH-3
                required:
                  - sku
                  - inStock
                  - reorderLevel
                  - warehouse
        '404':
          description: The requested route was not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
  /api/notifications:
    get:
      summary: Get random notification status
      operationId: getRandomNotification
      responses:
        '200':
          description: Randomly generated notification status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  notificationId:
                    type: string
                    minLength: 8
                    maxLength: 8
                    example: z9x8c7v6
                  channel:
                    type: string
                    enum:
                      - email
                      - sms
                      - push
                  priority:
                    type: string
                    enum:
                      - low
                      - medium
                      - high
                  sent:
                    type: boolean
                    example: true
                required:
                  - notificationId
                  - channel
                  - priority
                  - sent
        '404':
          description: The requested route was not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
  /api/friends:
    get:
      summary: Get friend list
      operationId: getFriendList
      responses:
        '200':
          description: A list of users in the friend list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendList'
              example:
                friends:
                  - id: u123ab45
                    name: User-123
                    active: true
                  - id: u678cd90
                    name: User-678
                    active: false
        '404':
          description: The requested route was not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
        '500':
          description: The requested route was not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
components:
  responses:
    NotFound:
      description: The requested route was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    MethodNotAllowed:
      description: The HTTP method is not supported. Only GET is allowed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
      additionalProperties: false
    ServiceInfo:
      type: object
      required:
        - message
        - endpoints
      properties:
        message:
          type: string
          example: Simple random JSON server
        endpoints:
          type: array
          items:
            type: string
          example:
            - /api/profile
            - /api/weather
            - /api/metrics
            - /api/orders
            - /api/inventory
            - /api/notifications
            - /api/friends
      additionalProperties: false
    Profile:
      type: object
      required:
        - id
        - name
        - score
        - active
      properties:
        id:
          type: string
          minLength: 8
          maxLength: 8
          example: ab12cd34
        name:
          type: string
          pattern: ^User-[0-9]{3}$
          example: User-123
        score:
          type: integer
          minimum: 1
          maximum: 100
          example: 87
        active:
          type: boolean
          example: true
      additionalProperties: false
    Weather:
      type: object
      required:
        - location
        - temperatureF
        - humidity
        - condition
      properties:
        location:
          type: string
          pattern: ^City-[0-9]+$
          example: City-12
        temperatureF:
          type: integer
          minimum: 40
          maximum: 100
          example: 72
        humidity:
          type: number
          minimum: 0.2
          maximum: 0.9
          example: 0.63
        condition:
          type: string
          enum:
            - sunny
            - cloudy
            - rainy
            - windy
      additionalProperties: false
    Metrics:
      type: object
      required:
        - requestId
        - cpuLoad
        - memoryMb
        - latencyMs
      properties:
        requestId:
          type: string
          minLength: 8
          maxLength: 8
          example: ef56gh78
        cpuLoad:
          type: number
          minimum: 0
          maximum: 1
          example: 0.421
        memoryMb:
          type: integer
          minimum: 128
          maximum: 4096
          example: 1024
        latencyMs:
          type: integer
          minimum: 10
          maximum: 500
          example: 125
      additionalProperties: false
    Order:
      type: object
      required:
        - orderId
        - itemCount
        - totalUsd
        - status
      properties:
        orderId:
          type: string
          pattern: ^ORD-[0-9]{6}$
          example: ORD-123456
        itemCount:
          type: integer
          minimum: 1
          maximum: 8
          example: 3
        totalUsd:
          type: number
          minimum: 9.99
          maximum: 499.99
          example: 149.95
        status:
          type: string
          enum:
            - processing
            - shipped
            - delivered
            - cancelled
      additionalProperties: false
    Inventory:
      type: object
      required:
        - sku
        - inStock
        - reorderLevel
        - warehouse
      properties:
        sku:
          type: string
          pattern: ^SKU-[0-9]{4}$
          example: SKU-4821
        inStock:
          type: integer
          minimum: 0
          maximum: 500
          example: 238
        reorderLevel:
          type: integer
          minimum: 10
          maximum: 150
          example: 75
        warehouse:
          type: string
          pattern: ^WH-[1-5]$
          example: WH-3
      additionalProperties: false
    Notification:
      type: object
      required:
        - notificationId
        - channel
        - priority
        - sent
      properties:
        notificationId:
          type: string
          minLength: 8
          maxLength: 8
          example: z9x8c7v6
        channel:
          type: string
          enum:
            - email
            - sms
            - push
        priority:
          type: string
          enum:
            - low
            - medium
            - high
        sent:
          type: boolean
          example: true
      additionalProperties: false
    Friend:
      type: object
      required:
        - id
        - name
        - active
      properties:
        id:
          type: string
          minLength: 8
          maxLength: 8
          example: u123ab45
        name:
          type: string
          pattern: ^User-[0-9]{3}$
          example: User-123
        active:
          type: boolean
          example: true
      additionalProperties: false
    FriendList:
      type: object
      required:
        - friends
      properties:
        friends:
          type: array
          items:
            $ref: '#/components/schemas/Friend'
      additionalProperties: false
