openapi: 3.0.0
info:
  title: Friend List Mock API
  version: 1.0.0
  description: A minimal mock API spec with a single endpoint for a friend list.
servers:
  - url: '{{baseUrl}}'
paths:
  /api/friends:
    get:
      summary: Get friend list
      operationId: getFriendList
      responses:
        '200':
          description: A list of users in the friend list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendListResponse'
              example:
                friends:
                  - id: u123ab45
                    name: User-123
                    active: true
                  - id: u678cd90
                    name: User-678
                    active: false
  /api/friends/{friendId}:
    get:
      summary: Get a friend by id
      operationId: getFriendById
      parameters:
        - in: path
          name: friendId
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 8
          example: u123ab45
      responses:
        '200':
          description: The friend with the provided id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Friend'
              example:
                id: u123ab45
                name: User-123
                active: true
        '404':
          description: Friend not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Friend not found
  /api/friends/search:
    get:
      summary: Search friends by name prefix
      operationId: searchFriends
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
            minLength: 1
          example: User-
      responses:
        '200':
          description: Friends matching the provided query.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendListResponse'
              example:
                friends:
                  - id: u123ab45
                    name: User-123
                    active: true
        '400':
          description: Invalid search query.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Query parameter q is required
  /api/friends/stats:
    get:
      summary: Get friend list statistics
      operationId: getFriendStats
      responses:
        '200':
          description: Aggregated stats for the current friend list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendStats'
              example:
                totalFriends: 24
                activeFriends: 18
                inactiveFriends: 6
components:
  schemas:
    Friend:
      type: object
      required:
        - id
        - name
        - active
      properties:
        id:
          type: string
          minLength: 8
          maxLength: 8
          example: u123ab45
        name:
          type: string
          pattern: ^User-[0-9]{3}$
          example: User-123
        active:
          type: boolean
          example: true
      additionalProperties: false
    FriendListResponse:
      type: object
      required:
        - friends
      properties:
        friends:
          type: array
          items:
            $ref: '#/components/schemas/Friend'
      additionalProperties: false
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
      additionalProperties: false
    FriendStats:
      type: object
      required:
        - totalFriends
        - activeFriends
        - inactiveFriends
      properties:
        totalFriends:
          type: integer
          minimum: 0
          example: 24
        activeFriends:
          type: integer
          minimum: 0
          example: 18
        inactiveFriends:
          type: integer
          minimum: 0
          example: 6
      additionalProperties: false
