$kind: http-example
name: Friend not found.
request:
  url: "{{baseUrl}}/api/friends/:friendId"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: X-API-Key
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  pathVariables:
    friendId: u123ab45
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "Friend not found"
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "error": {
            "type": "string"
          }
        },
        "required": [
          "error"
        ]
      }
order: 2000
