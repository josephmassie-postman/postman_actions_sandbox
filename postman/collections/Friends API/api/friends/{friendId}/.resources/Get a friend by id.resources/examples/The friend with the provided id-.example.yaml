$kind: http-example
name: The friend with the provided id.
request:
  url: "{{baseUrl}}/api/friends/:friendId"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: X-API-Key
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  pathVariables:
    friendId: u123ab45
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": "u123ab45",
        "name": "User-123",
        "active": true
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "minLength": 8,
            "maxLength": 8,
            "example": "u123ab45"
          },
          "name": {
            "type": "string",
            "pattern": "^User-[0-9]{3}$",
            "example": "User-123"
          },
          "active": {
            "type": "boolean",
            "example": true
          }
        },
        "required": [
          "id",
          "name",
          "active"
        ]
      }
order: 1000
