$kind: http-example
name: Aggregated stats for the current friend list.
request:
  url: "{{baseUrl}}/api/friends/stats"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: X-API-Key
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "totalFriends": 24,
        "activeFriends": 18,
        "inactiveFriends": 6
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "totalFriends": {
            "type": "integer",
            "minimum": 0,
            "example": 24
          },
          "activeFriends": {
            "type": "integer",
            "minimum": 0,
            "example": 18
          },
          "inactiveFriends": {
            "type": "integer",
            "minimum": 0,
            "example": 6
          }
        },
        "required": [
          "totalFriends",
          "activeFriends",
          "inactiveFriends"
        ]
      }
order: 1000
