$kind: http-example
name: Randomly generated notification status.
request:
  url: "{{baseUrl}}/api/notifications"
  method: GET
  headers:
    Accept: application/json
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "notificationId": "z9x8c7v6",
        "channel": "push",
        "priority": "medium",
        "sent": true
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "notificationId": {
            "type": "string",
            "minLength": 8,
            "maxLength": 8,
            "example": "z9x8c7v6"
          },
          "channel": {
            "type": "string",
            "enum": [
              "email",
              "sms",
              "push"
            ]
          },
          "priority": {
            "type": "string",
            "enum": [
              "low",
              "medium",
              "high"
            ]
          },
          "sent": {
            "type": "boolean",
            "example": true
          }
        },
        "required": [
          "notificationId",
          "channel",
          "priority",
          "sent"
        ]
      }
order: 1000
